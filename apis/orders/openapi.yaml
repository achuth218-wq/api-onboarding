openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
  description: Example API contract for onboarding a service into Kong Konnect.
# Keep this identifier stable across deployments.
x-kong-name: orders-api
servers:
  - url: https://orders.internal.com
    description: Placeholder; the pipeline replaces the upstream host per environment.
security:
  - ApiKeyAuth: []
tags:
  - name: Orders
    description: Create and retrieve orders.
paths:
  /v1/orders:
    get:
      operationId: listOrders
      summary: List orders
      tags: [Orders]
      responses:
        "200":
          description: Orders returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createOrder
      summary: Create an order
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: Order created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order; validated by the upstream application.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Request body exceeds the configured size limit.
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get an order by ID
      tags: [Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found.
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
  schemas:
    CreateOrder:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId:
          type: string
          minLength: 1
          example: product-123
        quantity:
          type: integer
          minimum: 1
          example: 2
    Order:
      type: object
      required: [id, productId, quantity, status]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [created, processing, completed, cancelled]
  responses:
    Unauthorized:
      description: The apikey header is missing or contains an invalid key.
    TooManyRequests:
      description: Rate limit exceeded; retry after the window resets.
