patches:
  - selectors:
      - $
    values:
      _konnect:
        control_plane_name: test-api
  - selectors:
      - $.services[*]
    values:
      host: orders.internal.example.com
      protocol: https
      port: 443
      # Avoid retrying non-idempotent order creation automatically.
      retries: 0
      connect_timeout: 5000
      read_timeout: 30000
      write_timeout: 30000
      tls_verify: false
  - selectors:
      - $..routes[*]
    values:
      protocols: [https]
      strip_path: false
      preserve_host: false
