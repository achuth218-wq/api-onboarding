name: Konnect API onboarding

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/konnect-api-onboarding.yml
      - apis/**
      - scripts/build-konnect-api.sh
      - scripts/konnect-services.py
      - requirements-apiops.txt
  push:
    branches: [main]
    paths:
      - .github/workflows/konnect-api-onboarding.yml
      - apis/**
      - scripts/build-konnect-api.sh
      - scripts/konnect-services.py
      - requirements-apiops.txt
  workflow_dispatch:
    inputs:
      service:
        description: Service folder name (orders, inventory, etc.) or all
        type: string
        default: all
        required: true
      environment:
        description: Target GitHub environment
        type: choice
        options: [development, staging, production]
        default: development
        required: true
      operation:
        description: Preview changes or deploy selected APIs
        type: choice
        options: [plan, deploy]
        default: plan
        required: true

permissions:
  contents: read

env:
  DECK_VERSION: "1.70.0"
  DECK_ANALYTICS: "false"
  DECK_NO_COLOR: "true"

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate OpenAPI and build Kong configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAPI validator
        run: python -m pip install -r requirements-apiops.txt

      - name: Install decK
        uses: kong/setup-deck@v1
        with:
          deck-version: ${{ env.DECK_VERSION }}

      # PRs, including forks, run this job without Konnect credentials.
      - name: Validate spec, attach plugins, and validate generated state
        env:
          SERVICE_SELECTOR: ${{ inputs.service || 'all' }}
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'development' }}
        run: python scripts/konnect-services.py build --service "$SERVICE_SELECTOR" --environment "$TARGET_ENVIRONMENT"

      - name: Save validated service configurations
        uses: actions/upload-artifact@v4
        with:
          name: konnect-api-config-${{ inputs.environment || 'development' }}-${{ github.sha }}
          path: build/deploy/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Plan or deploy to Konnect
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'development' }}
    concurrency:
      # Serialize entire batches, including single-service and all-service runs.
      group: konnect-api-onboarding
      cancel-in-progress: false
    steps:
      - name: Check out deployment scripts at this run's commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download configuration from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: konnect-api-config-${{ inputs.environment || 'development' }}-${{ github.sha }}
          path: build/deploy

      - name: Install configuration validation dependencies
        run: python -m pip install -r requirements-apiops.txt

      - name: Install decK
        uses: kong/setup-deck@v1
        with:
          deck-version: ${{ env.DECK_VERSION }}

      - name: Validate, preview, and optionally deploy
        env:
          DECK_KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
          DECK_KONNECT_ADDR: https://us.api.konghq.com
          OPERATION: ${{ inputs.operation || 'deploy' }}
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'development' }}
        run: python scripts/konnect-services.py deploy --operation "$OPERATION" --environment "$TARGET_ENVIRONMENT"
