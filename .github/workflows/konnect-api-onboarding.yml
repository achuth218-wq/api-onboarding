name: Konnect API onboarding

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/konnect-api-onboarding.yml
      - apis/orders/**
      - scripts/build-konnect-api.sh
      - requirements-apiops.txt
  push:
    branches: [main]
    paths:
      - .github/workflows/konnect-api-onboarding.yml
      - apis/orders/**
      - scripts/build-konnect-api.sh
      - requirements-apiops.txt
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment
        type: choice
        options: [development, staging, production]
        default: development
        required: true
      operation:
        description: Preview changes or deploy the API
        type: choice
        options: [plan, deploy]
        default: plan
        required: true

permissions:
  contents: read

env:
  DECK_VERSION: "1.70.0"
  DECK_ANALYTICS: "false"
  DECK_NO_COLOR: "true"
  API_TAG: api:orders-api

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate OpenAPI and build Kong configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAPI validator
        run: python -m pip install -r requirements-apiops.txt

      - name: Install decK
        uses: kong/setup-deck@v1
        with:
          deck-version: ${{ env.DECK_VERSION }}

      # PRs, including forks, run this job without Konnect credentials.
      - name: Validate spec, attach plugins, and validate generated state
        run: bash scripts/build-konnect-api.sh

      - name: Save validated configuration template
        uses: actions/upload-artifact@v4
        with:
          name: orders-api-${{ github.sha }}
          path: build/orders-api.template.yaml
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Plan or deploy to Konnect
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'development' }}
    concurrency:
      group: konnect-orders-api-${{ inputs.environment || 'development' }}
      cancel-in-progress: false
    steps:
      - name: Download configuration from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: orders-api-${{ github.sha }}
          path: build

      - name: Install decK
        uses: kong/setup-deck@v1
        with:
          deck-version: ${{ env.DECK_VERSION }}

      - name: Validate, preview, and optionally deploy
        env:
          DECK_KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
          DECK_KONNECT_CONTROL_PLANE_NAME: ${{ vars.KONNECT_CONTROL_PLANE_NAME }}
          DECK_KONNECT_ADDR: https://us.api.konghq.com
          DECK_ORDERS_UPSTREAM_HOST: ${{ vars.ORDERS_UPSTREAM_HOST }}
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation || 'deploy' }}
        run: |
          set -euo pipefail
          : "${DECK_KONNECT_TOKEN:?Set the KONNECT_TOKEN environment secret}"
          : "${DECK_KONNECT_CONTROL_PLANE_NAME:?Set the KONNECT_CONTROL_PLANE_NAME environment variable}"
          : "${DECK_ORDERS_UPSTREAM_HOST:?Set the ORDERS_UPSTREAM_HOST environment variable}"
          if [[ "$DECK_ORDERS_UPSTREAM_HOST" == *example.com ||
                "$DECK_ORDERS_UPSTREAM_HOST" == *://* ||
                "$DECK_ORDERS_UPSTREAM_HOST" == */* ||
                "$DECK_ORDERS_UPSTREAM_HOST" == *:* ]]; then
            echo "ORDERS_UPSTREAM_HOST must be your real upstream DNS name, without a scheme, path, or port." >&2
            exit 1
          fi

          # Gateway commands resolve environment placeholders in this template.
          # Use it directly to retain stable Service and Route IDs.
          deck file validate build/orders-api.template.yaml --konnect-compatibility
          deck gateway ping
          deck gateway validate build/orders-api.template.yaml --konnect-compatibility
          deck gateway diff build/orders-api.template.yaml \
            --select-tag "$API_TAG" --skip-consumers

          if [[ "$EVENT_NAME" == push || "$OPERATION" == deploy ]]; then
            deck gateway sync build/orders-api.template.yaml \
              --select-tag "$API_TAG" --skip-consumers --yes
            deck gateway diff build/orders-api.template.yaml \
              --select-tag "$API_TAG" --skip-consumers --non-zero-exit-code
            echo "Deployed Orders API and verified no remaining configuration drift." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Plan complete. Review the diff in the job log; no configuration was changed." >> "$GITHUB_STEP_SUMMARY"
          fi
