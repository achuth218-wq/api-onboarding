services:
  kong-dp:
    image: ${KONG_IMAGE:-kong/kong-gateway:3.15}
    container_name: kong-konnect-dp
    restart: unless-stopped
    env_file:
      - .env
    command:
      - kong
      - start
      - -c
      - /etc/kong/kong.conf
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
      - "8100:8100"
    volumes:
      - ./kong/kong.conf:/etc/kong/kong.conf:ro
      - ./certs/data-plane:/etc/kong/mtls:ro
